<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment 3 - Landing Page</title>
    <link href="./output.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="font-[Inter] bg-slate-950">
    <!-- ========== NAVBAR ========== -->
    <nav
      class="lg:px-36 px-5 text-white flex m-auto justify-between items-center h-[5.2rem]"
    >
      <div>
        <a href="#" class="text-2xl md:text-4xl lg:text-4xl font-bold">Tech.</a>
      </div>
      <ul class="lg:flex md:flex hidden gap-3.5">
        <li>
          <a class="text-sm hover:text-gray-500" href="#hero">About</a>
        </li>
        <li>
          <a class="text-sm hover:text-gray-500" href="#whoweare">Service</a>
        </li>
        <li>
          <a class="text-sm hover:text-gray-500" href="#ourwork">Our Work</a>
        </li>
        <li>
          <a class="text-sm hover:text-gray-500" href="#team">Team</a>
        </li>
      </ul>
      <div>
        <button class="lg:hidden md:hidden block">
          <img src="/assets/icons/hambgr-menu.png" alt="" />
        </button>

        <button
          class="md:flex hidden bg-[#421ABC] px-5 py-2 rounded-full hover:[#87acec]"
        >
          Contact Us
        </button>
      </div>
    </nav>
    <!-- ========== HERO SECTION ========== -->
    <main>
      <section class="relative bg-gray-900 py-5 px-6">
        <!-- container flex -->
        <div
          class="max-w-7xl mx-auto flex flex-col md:flex-row items-center gap-12"
        >
          <!-- Div 1: Text Content -->
          <div
            class="z-10 w-full md:w-1/2 text-center md:text-left px-12 lg:relative"
          >
            <h1
              class="text-4xl lg:text-6xl md:text-6xl font-bold text-white leading-tight"
            >
              Build with the Future.
            </h1>
            <p class="mt-6 text-lg text-gray-600">
              From building sleek websites and mobile apps to integrating AI
              solutions, we help brands turn ideas into powerful digital
              experiences that connect, engage, and scale.
            </p>
            <div class="mt-8 flex justify-center md:justify-start gap-4">
              <button
                class="bg-blue-600 text-white px-8 py-3 rounded-full font-semibold hover:bg-blue-700 transition"
              >
                Let's Talk
              </button>
            </div>
          </div>

          <!-- Div 2: Image -->
          <div
            class="relative w-full md:w-1/2 relative h-64 sm:h-96 lg:h-[500px]"
          >
            <img
              src="../assets/images/hero-img-handsphone.png"
              alt="Hero Image"
              class="rounded-2xl object-cover w-full"
            />
          </div>
        </div>
      </section>
    </main>
    <!-- ========== FOOTER ========== -->
  </body>
</html>
